<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAMZAISSAC</title>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="touch-controls" hidden aria-hidden="true">
      <div class="touch-orientation-hint" role="status">
        <span class="touch-rotate-icon" aria-hidden="true">↻</span>
        <span id="touch-rotate-label"></span>
      </div>

      <div class="touch-interface">
        <div id="touch-movement-stick" class="touch-stick touch-stick--movement" role="group">
          <span class="touch-stick-guide" aria-hidden="true"></span>
          <img
            id="touch-movement-knob"
            class="touch-stick-knob"
            src="/assets/ui/vryell/touch-stick.png"
            alt=""
            draggable="false"
          />
        </div>

        <div class="touch-top-actions">
          <button id="touch-pause" class="touch-action touch-action--pause" type="button">
            <span aria-hidden="true">Ⅱ</span>
          </button>
        </div>

        <div class="touch-fire-cluster">
          <button id="touch-bomb" class="touch-action touch-action--bomb" type="button">
            <img src="/assets/icons/nikoichu/hud-bomb.png" alt="" draggable="false" />
            <span id="touch-bomb-count">0</span>
          </button>
          <button
            id="touch-purchase"
            class="touch-action touch-action--purchase"
            type="button"
            hidden
          >
            <span id="touch-purchase-label"></span>
          </button>
          <div id="touch-fire-stick" class="touch-stick touch-stick--fire" role="group">
            <span class="touch-stick-guide" aria-hidden="true"></span>
            <img
              id="touch-fire-knob"
              class="touch-stick-knob"
              src="/assets/ui/vryell/touch-stick.png"
              alt=""
              draggable="false"
            />
          </div>
        </div>
      </div>
    </div>
    <div id="intro-overlay" hidden>
      <div class="intro-stage">
        <span class="intro-guide intro-guide--top" aria-hidden="true"></span>
        <span class="intro-guide intro-guide--bottom" aria-hidden="true"></span>
        <span class="intro-guide intro-guide--left" aria-hidden="true"></span>
        <span class="intro-guide intro-guide--right" aria-hidden="true"></span>
        <p id="intro-kicker" class="intro-kicker"></p>
        <div class="intro-band"><h1 id="intro-title" class="intro-title"></h1></div>
        <p id="intro-subtitle" class="intro-subtitle"></p>
        <p id="intro-skip" class="intro-skip"></p>
      </div>
    </div>
    <div id="game-over-overlay" hidden>
      <section
        class="game-over-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="game-over-title"
      >
        <h1 id="game-over-title"></h1>
        <p id="game-over-summary"></p>
        <button id="game-over-restart" type="button"></button>
      </section>
    </div>
    <div id="escape-overlay" hidden>
      <section class="escape-panel" role="dialog" aria-modal="true" aria-labelledby="escape-title">
        <h1 id="escape-title"></h1>
        <p id="escape-summary"></p>
        <button id="escape-return" type="button"></button>
      </section>
    </div>
    <aside id="developer-console" hidden aria-label="개발자 콘솔">
      <header id="developer-console-drag-handle">
        <strong>DEV CONSOLE</strong>
        <span>드래그로 이동 · ` 또는 Esc로 닫기</span>
      </header>
      <div id="developer-console-output" role="log" aria-live="polite"></div>
      <form id="developer-console-form" autocomplete="off">
        <label for="developer-console-input">&gt;</label>
        <input
          id="developer-console-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="개발자 명령어"
        />
      </form>
      <div
        id="developer-console-suggestions"
        hidden
        role="listbox"
        aria-label="명령어 자동완성"
      ></div>
      <div id="developer-console-resize-handle" aria-hidden="true"></div>
    </aside>
    <section id="developer-console-item-picker" hidden aria-label="아이템 생성 선택">
      <div id="developer-item-picker-drag-handle" class="developer-item-picker-title">
        <strong>ITEM SPAWN</strong>
        <span>F2 토글 · 드래그 이동 · 방향키 선택 · Space/Enter 또는 클릭으로 생성</span>
      </div>
      <div id="developer-console-item-grid" role="grid" aria-label="생성할 아이템"></div>
      <div id="developer-item-picker-resize-handle" aria-hidden="true"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
